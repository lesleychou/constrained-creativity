"135" font-size="6" text-anchor="start" fill="#262626">compose a new DAG</text><circle cx="11.8" cy="141.9" r="3.8" fill="#C2410C"/><text x="11.8" y="144.05" font-size="6" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="18" y="144" font-size="6" text-anchor="start" fill="#262626">evolve operators</text></g><g id="a:title" data-kind="annotation"><text x="216.0" y="13" font-size="8" text-anchor="middle" fill="#C2410C" font-weight="bold">LegoRCA as Constrained Creativity</text></g><g id="lint-overlay" pointer-events="none" font-family="Arimo, Arial, sans-serif">
