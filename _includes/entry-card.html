<article class="entry-card">
    <a class="entry-title" href="{{ include.entry.url | relative_url }}">{{ include.entry.title }}</a>
    <p class="entry-meta">{% include byline.html authors=include.entry.authors %} &middot; {{ include.entry.date | date: "%B %-d, %Y" }}</p>
    {% if include.entry.description %}<p class="entry-desc">{{ include.entry.description }}</p>{% endif %}
    {% if include.entry.download %}<p class="entry-links"><a href="{{ include.entry.download }}">Download</a></p>{% endif %}
</article>
